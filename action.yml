name: "Aura agent check"
description: "Statically verify AI agent designs — fail the build on prompt-injection paths, unproven obligations, or leaked secrets."
branding:
  icon: "shield"
  color: "green"
inputs:
  paths:
    description: "Space-separated flow files or globs to check (studio .json exports, .py agents, or MCP tools/list JSON)."
    required: false
    default: "agents/*.json"
  baseline:
    description: "Optional prior `check --json` output. When set, the build fails only on NEW blocking findings (regression gate) instead of any existing one."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        python -m pip install --quiet aura-state
        if [ -n "${{ inputs.baseline }}" ]; then
          aura-state check ${{ inputs.paths }} --baseline "${{ inputs.baseline }}"
        else
          aura-state check ${{ inputs.paths }}
        fi
