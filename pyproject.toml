[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-state"
version = "0.2.0"
description = "Build LLM agents you can prove things about — Z3 proofs, CTL model checking, and conformal risk control, verified in the loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohan Munshi" }]
keywords = [
    "llm", "agents", "formal-verification", "z3", "smt",
    "model-checking", "ctl", "conformal-prediction", "state-machine",
    "prompt-injection", "ai-safety", "agent-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "instructor>=1.3",
    "openai>=1.0",
    "python-dotenv>=1.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "pyModelChecking>=1.3",
    "z3-solver>=4.12",
]

[project.urls]
Homepage = "https://github.com/munshi007/Aura-State"
Repository = "https://github.com/munshi007/Aura-State"
Issues = "https://github.com/munshi007/Aura-State/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
