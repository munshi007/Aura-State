<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aura Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600;700&display=swap">
<style>
:root{
  --bg:#0b0d12;--panel:#12151d;--panel2:#0f121a;--edge:#1e222d;--edge2:#2a3040;
  --ink:#e9ecf3;--soft:#aeb6c6;--muted:#6d7688;--faint:#454d5d;
  --indigo:#8b88f5;--indigo-dim:#4d4aa8;--indigo-glow:rgba(139,136,245,.35);
  --green:#3ecf8e;--green-dim:#1c7a54;--green-bg:rgba(62,207,142,.10);
  --amber:#f0894e;--amber-dim:#9c4a24;--amber-bg:rgba(240,137,78,.10);--amber-glow:rgba(240,137,78,.45);
  --grid:rgba(255,255,255,.022);
  --extract:#8b88f5;--decision:#5fb3d9;--sink:#ff7a7a;--sanitizer:#3ecf8e;--plain:#6d7688;
}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;overflow:hidden}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--edge2);border-radius:6px}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
h1,h2,h3{font-family:"IBM Plex Serif",serif}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:220px 1fr;height:100vh}
/* nav */
.nav{background:linear-gradient(180deg,#12151d,#0d1017);border-right:1px solid var(--edge);display:flex;flex-direction:column}
.nav .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;font-family:"IBM Plex Serif",serif;font-weight:700;font-size:16px;border-bottom:1px solid var(--edge)}
.nav .brand svg{filter:drop-shadow(0 0 9px var(--indigo-glow))}
.navlist{padding:8px 8px;flex:1;overflow:auto}
.navsec{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--soft);font-weight:500;font-size:13.5px;cursor:pointer;margin-bottom:2px}
.navitem:hover{background:#161a24;color:var(--ink)}.navitem.on{background:#1a1d2b;color:var(--ink)}
.navitem .ic{width:17px;height:17px;color:var(--muted);flex:none}.navitem.on .ic{color:var(--indigo)}
.nav .foot{padding:12px 16px;border-top:1px solid var(--edge);font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted)}
/* workspace */
.ws{overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wsbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--edge);background:var(--panel);gap:14px}
.wsbar .ttl{font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.wsbar .ttl .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);font-weight:400}
.wsbody{flex:1;overflow:hidden;min-height:0}
.btn{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--edge2);background:#161a24;color:var(--ink);transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--indigo-dim)}
.btn.primary{background:linear-gradient(180deg,#5c58e0,#4a46c8);border-color:transparent;box-shadow:0 0 0 1px rgba(139,136,245,.3),0 6px 18px rgba(74,70,200,.35)}
.btn.primary:hover{filter:brightness(1.08)}.btn.ghost{background:transparent}.btn.sm{padding:5px 10px;font-size:12px}
.actions{display:flex;gap:9px;align-items:center}
.pill{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--edge2);border-radius:6px;padding:5px 9px}

/* BUILD layout: palette+list | canvas | inspector */
.build{display:grid;grid-template-columns:250px 1fr 320px;height:100%}
.rail,.insp{overflow-y:auto;background:var(--panel)}
.rail{border-right:1px solid var(--edge)}.insp{border-left:1px solid var(--edge)}
.canvas-wrap{position:relative;background:radial-gradient(circle at 1px 1px,var(--grid) 1px,transparent 0) 0 0/26px 26px,radial-gradient(1200px 500px at 55% -10%,rgba(139,136,245,.06),transparent 60%),var(--panel2);overflow:hidden}
#cv{width:100%;height:100%;display:block}
.sec{padding:14px 14px 4px}.sec h3{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--soft);font-family:"IBM Plex Sans"}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.palette button{display:flex;flex-direction:column;gap:3px;align-items:flex-start;padding:9px 10px;border-radius:9px;border:1px solid var(--edge2);background:var(--panel2);color:var(--ink);font-size:12px;font-weight:600}
.palette button:hover{border-color:var(--indigo-dim)}
.palette .dot{width:8px;height:8px;border-radius:50%}
.nlist .ncard{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--edge2);border-radius:9px;padding:9px 11px;margin-bottom:7px;background:var(--panel2);cursor:pointer}
.nlist .ncard:hover{border-color:var(--indigo-dim)}.nlist .ncard.sel{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo-dim)}
.nlist .nm{font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.tdot{width:8px;height:8px;border-radius:50%;flex:none}
.badge{font-family:"IBM Plex Mono",monospace;font-size:9px;color:var(--muted)}
/* inspector fields */
.fld{margin:0 0 14px}
.fld label{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--edge2);border-radius:8px;background:var(--panel2);color:var(--ink);font-size:13px}
.fld textarea{font-family:"IBM Plex Mono",monospace;font-size:12px;min-height:60px;resize:vertical;line-height:1.55}
.fld input.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--indigo)}
.two{display:flex;gap:10px}.two>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);margin-bottom:12px;cursor:pointer}
.chk input{width:auto}
.mini{width:100%;border-collapse:collapse}.mini td{padding:3px 3px}.mini input,.mini select{width:100%}
.rowbtn{color:#ff7a7a;background:transparent;border:none;padding:4px 6px}
.addrow{color:var(--indigo);background:transparent;border:1px dashed var(--edge2);border-radius:8px;padding:6px;font-weight:600;font-size:12px;width:100%;margin-top:6px}
.del{color:#ff7a7a;background:transparent;border:1px solid #5a2626;border-radius:8px;padding:8px;font-size:12px;font-weight:600;width:100%;margin-top:6px}
.insphdr{padding:14px 16px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:9px;font-weight:600}
.inspbody{padding:16px}
.empty{color:var(--muted);text-align:center;padding:50px 20px;font-size:13px;line-height:1.6}

/* generic 2-col (Run, Prove, etc.) */
.cols{display:grid;grid-template-columns:1fr 1fr;height:100%}
.form{padding:22px;border-right:1px solid var(--edge);overflow:auto}
.out{padding:20px;overflow:auto;background:var(--panel2)}
.metric{border:1px solid var(--edge2);border-radius:12px;padding:15px 17px;margin-bottom:13px;background:var(--panel)}
.metric .k{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font-family:"IBM Plex Serif",serif;font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.v{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.v.ok{color:var(--green);background:var(--green-bg);border:1px solid var(--green-dim)}
.v.bad{color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-dim)}
.v.muted{color:var(--muted);border:1px solid var(--edge2)}
pre{margin:0;padding:12px;background:#0c0e14;border:1px solid var(--edge2);border-radius:9px;overflow:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.55;color:var(--soft)}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.cex{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--amber);background:var(--amber-bg);border:1px solid var(--amber-dim);border-radius:7px;padding:8px 10px;margin-top:6px;line-height:1.5}
/* run trace */
.step{border:1px solid var(--edge2);border-radius:11px;padding:13px 15px;margin-bottom:11px;background:var(--panel);position:relative}
.step .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.step .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.step .arrow{color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:11px}
.feedrow{padding:13px 16px;border-bottom:1px solid var(--edge)}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 128 128" fill="none">
        <g stroke="#8b88f5" stroke-width="6" stroke-linecap="round"><line x1="46" y1="80" x2="59" y2="55"/><line x1="82" y1="80" x2="69" y2="55"/></g>
        <circle cx="42" cy="88" r="10" fill="#12151d" stroke="#8b88f5" stroke-width="6"/><circle cx="86" cy="88" r="10" fill="#12151d" stroke="#8b88f5" stroke-width="6"/>
        <circle cx="64" cy="42" r="13" fill="#3ecf8e"/><path d="M57.5 42.5 l4.3 4.3 l8-8.6" stroke="#0b0d12" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>Aura Studio
    </div>
    <div class="navlist" id="nav"></div>
    <div class="foot">local · no cloud · no key<br>v0.5 · MIT</div>
  </div>
  <div class="ws">
    <div class="wsbar"><div class="ttl" id="wstitle"></div><div class="actions" id="wsactions"></div></div>
    <div class="wsbody" id="ws"></div>
  </div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
function ic(p){return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
const MODULES=[
  {id:"build",group:"Agent",name:"Build",sub:"design your agent",icon:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><path d="M10 6.5h4a2 2 0 0 1 2 2V14"/>'},
  {id:"run",group:"Agent",name:"Run",sub:"execute + trace + prove",icon:'<path d="M6 4l14 8-14 8z"/>'},
  {id:"prove",group:"Verify",name:"Prove data",sub:"Z3 point-check",icon:'<path d="M14 3v5h5"/><path d="M6 3h8l5 5v11a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M9 14l2 2 4-4"/>'},
  {id:"data",group:"Verify",name:"Import data",sub:"bulk-verify a dataset",icon:'<path d="M12 3v11"/><path d="M8 7l4-4 4 4"/><path d="M4 21h16"/>'},
  {id:"monitor",group:"Runtime",name:"Monitor",sub:"live feed from your agent",icon:'<path d="M2 12h4l2-6 4 12 3-9 2 3h5"/>'},
  {id:"uncertainty",group:"Calibrate",name:"Uncertainty",sub:"conformal · PASC",icon:'<path d="M3 12h4l3 8 4-16 3 8h4"/>'},
  {id:"risk",group:"Calibrate",name:"Risk control",sub:"abstention · escalate",icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>'},
  {id:"settings",group:"System",name:"Settings",sub:"providers · save / load",icon:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.3 2.9a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.9h5l.3-2.9a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1z"/>'},
];
let current="build",feedTimer=null;

/* ── AGENT MODEL (shared) ── */
const TYPES={extract:{label:"Extract",color:"var(--extract)"},decision:{label:"Decision",color:"var(--decision)"},
  tool:{label:"Tool / sink",color:"var(--sink)"},sanitizer:{label:"Sanitizer",color:"var(--sanitizer)"}};
let AG={name:"refund-agent",provider:"ollama",nodes:[],edges:[],entry:null,sel:null};
function preset(){AG.nodes=[
  {id:"Ingest",type:"extract",system_prompt:"Extract the customer's refund request from the message.",model:"",
   fields:[{name:"refund_amount",type:"int"},{name:"order_total",type:"int"}],obligations:"refund_amount <= order_total, refund_amount >= 0",
   consensus:1,confidence:0.9,untrusted:true},
  {id:"Review",type:"sanitizer",system_prompt:"Policy review that sanitizes the request."},
  {id:"IssueRefund",type:"tool",system_prompt:"Issue the refund (irreversible).",sink_fields:""}];
  AG.edges=[["Ingest","Review"],["Review","IssueRefund"]];AG.entry="Ingest";AG.sel="Ingest"}
function nodeById(id){return AG.nodes.find(n=>n.id===id)}
function capOf(n){if(n.type==="extract")return n.untrusted?"untrusted":"plain";if(n.type==="tool")return "sink";if(n.type==="sanitizer")return "sanitizer";return "plain"}
function specForBackend(withInput){
  const nodes=AG.nodes.map(n=>({id:n.id,type:n.type==="tool"?"tool":n.type,capability:capOf(n),
    system_prompt:n.system_prompt||"",model:n.model||"",fields:n.fields||[],
    obligations:(n.obligations||"").split(",").map(s=>s.trim()).filter(Boolean),
    sandbox_rule:n.sandbox_rule||"",consensus:n.consensus||1,confidence:n.confidence||0.9}));
  const s={provider:AG.provider,nodes,edges:AG.edges,entry:AG.entry||AG.nodes[0]?.id};
  if(withInput!==undefined)s.input=withInput;return s}

/* ── NAV ── */
function renderNav(){const n=document.getElementById("nav");const groups=[...new Set(MODULES.map(m=>m.group))];
  n.innerHTML=groups.map(g=>`<div class="navsec">${g}</div>`+MODULES.filter(m=>m.group===g).map(m=>
    `<div class="navitem ${m.id===current?'on':''}" onclick="go('${m.id}')">${ic(m.icon)}<span>${m.name}</span></div>`).join("")).join("")}
function go(id){if(feedTimer){clearInterval(feedTimer);feedTimer=null}current=id;renderNav();
  const m=MODULES.find(x=>x.id===id);document.getElementById("wstitle").innerHTML=`${m.name} <span class="sub">${m.sub}</span>`;
  document.getElementById("wsactions").innerHTML="";
  ({build:Build,run:Run,prove:Prove,data:DataImport,monitor:Monitor,uncertainty:Uncertainty,risk:Risk,settings:Settings})[id]()}

/* ══════════ BUILD ══════════ */
function Build(){
  document.getElementById("wsactions").innerHTML=
    `<span class="pill" id="agname">${esc(AG.name)}</span>
     <button class="btn ghost" onclick="bVerify()">Verify design</button>
     <button class="btn primary" onclick="go('run')">Run ▶</button>`;
  document.getElementById("ws").innerHTML=`<div class="build">
    <div class="rail"><div class="sec"><h3>Add a node</h3>
      <div class="palette">
        <button onclick="bAdd('extract')"><span class="dot" style="background:var(--extract)"></span>Extract</button>
        <button onclick="bAdd('decision')"><span class="dot" style="background:var(--decision)"></span>Decision</button>
        <button onclick="bAdd('tool')"><span class="dot" style="background:var(--sink)"></span>Tool / sink</button>
        <button onclick="bAdd('sanitizer')"><span class="dot" style="background:var(--sanitizer)"></span>Sanitizer</button>
      </div>
      <h3>Nodes</h3><div class="nlist" id="nlist"></div></div></div>
    <div class="canvas-wrap"><svg id="cv" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="insp" id="insp"></div></div>`;
  bRail();bCanvas();bInsp();
}
function bAdd(type){let base=type==="extract"?"Extract":type==="decision"?"Decide":type==="tool"?"Action":"Clean";
  let id=base,i=1;while(nodeById(id)){id=base+(++i)}
  const n={id,type,system_prompt:"",model:""};if(type==="extract"){n.fields=[{name:"value",type:"str"}];n.obligations="";n.consensus=1;n.confidence=0.9;n.untrusted=true}
  if(AG.nodes.length)AG.edges.push([AG.nodes[AG.nodes.length-1].id,id]);
  AG.nodes.push(n);AG.sel=id;if(!AG.entry)AG.entry=id;bRail();bCanvas();bInsp()}
function bDel(id){AG.nodes=AG.nodes.filter(n=>n.id!==id);AG.edges=AG.edges.filter(e=>e[0]!==id&&e[1]!==id);
  if(AG.entry===id)AG.entry=AG.nodes[0]?.id||null;AG.sel=AG.nodes[0]?.id||null;bRail();bCanvas();bInsp()}
function bRail(){const L=document.getElementById("nlist");if(!L)return;L.innerHTML=AG.nodes.map(n=>
  `<div class="ncard ${n.id===AG.sel?'sel':''}" onclick="AG.sel='${n.id}';bRail();bInsp()">
    <span class="nm"><span class="tdot" style="background:${TYPES[n.type].color}"></span>${esc(n.id)}${n.id===AG.entry?' <span class="badge">entry</span>':''}</span>
    <span class="badge">${TYPES[n.type].label}</span></div>`).join("")||'<div class="hint">add a node to begin</div>'}
function bInsp(){const I=document.getElementById("insp");const n=nodeById(AG.sel);if(!I)return;
  if(!n){I.innerHTML='<div class="empty">Select a node to configure it,<br>or add one from the palette.</div>';return}
  const outs=AG.edges.filter(e=>e[0]===n.id).map(e=>e[1]);
  let body=`<div class="fld"><label>node id</label><input value="${esc(n.id)}" oninput="bRename('${n.id}',this.value)"></div>
    <div class="fld"><label>node type</label><select onchange="bType('${n.id}',this.value)">${Object.keys(TYPES).map(t=>`<option value="${t}" ${t===n.type?'selected':''}>${TYPES[t].label}</option>`).join("")}</select></div>
    <div class="fld"><label>system prompt</label><textarea oninput="nodeById('${n.id}').system_prompt=this.value">${esc(n.system_prompt||"")}</textarea></div>`;
  if(n.type==="extract"){
    body+=`<div class="fld"><label>model (blank = provider default)</label><input class="mono" value="${esc(n.model||"")}" placeholder="qwen2.5:0.5b" oninput="nodeById('${n.id}').model=this.value"></div>
      <div class="fld"><label>extraction fields</label><table class="mini" id="flds"></table><button class="addrow" onclick="bAddField('${n.id}')">+ field</button></div>
      <label class="chk"><input type="checkbox" ${n.untrusted?'checked':''} onchange="nodeById('${n.id}').untrusted=this.checked;bCanvas()"> output is untrusted (taint source)</label>
      <div class="two"><div class="fld"><label>consensus runs</label><input type="number" min="1" value="${n.consensus||1}" oninput="nodeById('${n.id}').consensus=+this.value"></div>
        <div class="fld"><label>confidence</label><select onchange="nodeById('${n.id}').confidence=+this.value"><option ${n.confidence==0.9?'selected':''}>0.9</option><option ${n.confidence==0.95?'selected':''}>0.95</option><option ${n.confidence==0.8?'selected':''}>0.8</option></select></div></div>
      <div class="fld"><label>Z3 obligations (comma-sep)</label><input class="mono" value="${esc(n.obligations||"")}" placeholder="total == area * rate" oninput="nodeById('${n.id}').obligations=this.value"></div>`;
  }else if(n.type==="decision"){
    body+=`<div class="fld"><label>sandbox rule (no-exec)</label><input class="mono" value="${esc(n.sandbox_rule||"")}" placeholder="result = budget > 100000" oninput="nodeById('${n.id}').sandbox_rule=this.value"></div>
      <div class="fld"><label>Z3 obligations (comma-sep)</label><input class="mono" value="${esc(n.obligations||"")}" oninput="nodeById('${n.id}').obligations=this.value"></div>`;
  }else if(n.type==="tool"){
    body+=`<div class="fld"><label>guarded fields (comma-sep, blank = any)</label><input class="mono" value="${esc(n.sink_fields||"")}" placeholder="account_id, amount" oninput="nodeById('${n.id}').sink_fields=this.value"></div>
      <div class="hint">Marked a <b>dangerous sink</b> — taint analysis proves no untrusted field reaches it.</div>`;
  }else if(n.type==="sanitizer"){
    body+=`<div class="fld"><label>sanitized fields (comma-sep, blank = all)</label><input class="mono" value="${esc(n.sanitizes_fields||"")}" oninput="nodeById('${n.id}').sanitizes_fields=this.value"></div>
      <div class="hint">Clears taint — untrusted data can't pass through unless it goes through here.</div>`;
  }
  body+=`<div class="fld"><label>transitions to</label>${AG.nodes.filter(m=>m.id!==n.id).map(m=>`<label class="chk"><input type="checkbox" ${outs.includes(m.id)?'checked':''} onchange="bEdge('${n.id}','${m.id}',this.checked)"> ${esc(m.id)}</label>`).join("")||'<div class="hint">add more nodes to connect</div>'}</div>
    <button class="btn sm ghost" style="width:100%;justify-content:center;margin-bottom:8px" onclick="AG.entry='${n.id}';bRail();bCanvas()">Set as entry node</button>
    <button class="del" onclick="bDel('${n.id}')">Delete node</button>`;

  AG.edges.forEach(([a,b])=>{if(!XY[a]||!XY[b])return;const s=XY[a],t=XY[b];const x1=s.x+NW,y1=s.cy,x2=t.x,y2=t.cy;const mx=(x1+x2)/2;const bad=bE.has(a+">"+b);

  AG.nodes.forEach(n=>{const c=XY[n.id];const g=document.createElementNS(NS,"g");g.style.cursor="pointer";g.onclick=()=>{AG.sel=n.id;bRail();bInsp();bCanvas()};
    const col=TYPES[n.type].color;const onBad=bN.has(n.id);const ring=n.id===AG.sel?"#8b88f5":(onBad?"#f0894e":"#242a37");
    const r=document.createElementNS(NS,"rect");r.setAttribute("x",c.x);r.setAttribute("y",c.y);r.setAttribute("width",NW);r.setAttribute("height",NH);r.setAttribute("rx",12);r.setAttribute("fill","#141824");r.setAttribute("stroke",ring);r.setAttribute("stroke-width",n.id===AG.sel?2:1.4);if(onBad)r.setAttribute("filter","drop-shadow(0 0 8px var(--amber-glow))");g.appendChild(r);
    const dot=document.createElementNS(NS,"circle");dot.setAttribute("cx",c.x+16);dot.setAttribute("cy",c.y+19);dot.setAttribute("r",5);dot.setAttribute("fill",col.startsWith("var")?getCSS(col):col);g.appendChild(dot);

    const cl=document.createElementNS(NS,"text");cl.setAttribute("x",c.x+30);cl.setAttribute("y",c.y+39);cl.setAttribute("fill","#6d7688");cl.setAttribute("font-size","10");cl.setAttribute("font-family","IBM Plex Mono");cl.textContent=TYPES[n.type].label+(n.id===AG.entry?" · entry":"");g.appendChild(cl);cv.appendChild(g)})}

  const I=document.getElementById("cf_in");
  if(cfMode==="interval"){I.innerHTML=`<div class="fld"><label>Samples (comma-sep)</label><textarea id="cf_vals">450000, 452000, 448000, 451000, 449000, 450500, 447500, 452500, 449500, 450000, 451500, 448500, 450200, 449800, 451000, 448000, 452000, 450000, 449000, 451000</textarea></div>`;document.getElementById("cf_hint").innerHTML="Split/jackknife+ conformal — distribution-free."}
  else{I.innerHTML=`<div class="fld"><label>Pipeline predictions</label><textarea id="cf_pred">10.2, 9.7, 11.4, 8.9, 10.1, 12.0, 9.3, 10.8, 11.1, 9.9, 10.4, 8.7, 11.6, 10.0, 9.5, 10.9, 11.2, 9.1, 10.3, 10.7</textarea></div><div class="fld"><label>Ground truth</label><textarea id="cf_true">10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0, 10.0</textarea></div>`;document.getElementById("cf_hint").innerHTML="PASC calibrates the <b>end-to-end</b> output — per-step coverage under-covers the final answer."}}
async function cfRun(){const conf=parseFloat(document.getElementById("cf_conf").value);const out=document.getElementById("cf_out");let body;
  if(cfMode==="interval"){body={values:document.getElementById("cf_vals").value.split(",").map(s=>parseFloat(s)).filter(x=>!isNaN(x)),confidence:conf}}
  else{body={predictions:document.getElementById("cf_pred").value.split(",").map(s=>parseFloat(s)).filter(x=>!isNaN(x)),truths:document.getElementById("cf_true").value.split(",").map(s=>parseFloat(s)).filter(x=>!isNaN(x)),confidence:conf}}
  let d;try{d=await(await fetch("/api/conformal",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json()}catch(e){out.innerHTML="error";return}
  if(d.mode==="pasc"){out.innerHTML=`<div class="metric"><div class="k">end-to-end coverage (PASC)</div><div class="big" style="margin-top:8px">${(d.coverage*100).toFixed(1)}%</div><div style="margin-top:8px"><span class="v ${d.calibrated?'ok':'bad'}">${d.calibrated?'CALIBRATED':'UNCALIBRATED'}</span> · target ${(conf*100)}%</div></div><div class="metric"><div class="k">interval half-width</div><div class="big" style="font-size:22px;margin-top:6px">±${d.q_hat==null?'—':fmt(d.q_hat)}</div></div>`;return}
  out.innerHTML=`<div class="metric"><div class="k">${(conf*100)}% prediction interval</div><div class="big" style="margin-top:8px">${d.lower==null?'—':fmt(d.lower)} – ${d.upper==null?'—':fmt(d.upper)}</div><div style="margin-top:8px"><span class="v ${d.calibrated?'ok':'bad'}">${d.calibrated?'CALIBRATED':'UNCALIBRATED — too few'}</span></div></div><div class="metric"><div class="k">point estimate</div><div class="big" style="font-size:22px;margin-top:6px">${d.point==null?'—':fmt(d.point)}</div></div>`}
function fmt(x){return (Math.abs(x)>=1000)?x.toLocaleString(undefined,{maximumFractionDigits:0}):x.toFixed(2)}

/* ══════════ RISK ══════════ */
function Risk(){document.getElementById("ws").innerHTML=`<div class="cols"><div class="form">
  <div class="fld"><label>Confidence scores (0–1, comma-sep)</label><textarea id="rk_s"></textarea></div>
  <div class="fld"><label>Was acting correct? (1/0)</label><textarea id="rk_c"></textarea></div>
  <div class="two"><div class="fld"><label>Risk budget ε</label><input id="rk_eps" value="0.05"></div><div class="fld"><label>Test a score</label><input id="rk_test" value="0.4"></div></div>
  <button class="btn ghost" onclick="rkSample()">Generate sample data</button>
  <div class="hint" style="margin-top:10px">Conformal Risk Control: threshold so the false-action rate is provably ≤ ε; below it, abstain → escalate.</div></div>
  <div class="out" id="rk_out"><div class="empty">Calibrate on labeled data to get a risk-controlled gate.</div></div></div>`;
  document.getElementById("wsactions").innerHTML=`<button class="btn primary" onclick="rkRun()">Calibrate gate</button>`;rkSample()}
function rkSample(){let s=[],c=[],seed=7;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};for(let i=0;i<300;i++){const x=rnd();s.push(+x.toFixed(3));c.push(rnd()<x?1:0)}document.getElementById("rk_s").value=s.join(", ");document.getElementById("rk_c").value=c.join(", ")}
async function rkRun(){const s=document.getElementById("rk_s").value.split(",").map(x=>parseFloat(x)).filter(x=>!isNaN(x));const c=document.getElementById("rk_c").value.split(",").map(x=>x.trim()==="1"||x.trim().toLowerCase()==="true");const eps=parseFloat(document.getElementById("rk_eps").value);const test=parseFloat(document.getElementById("rk_test").value);const out=document.getElementById("rk_out");
  let d;try{d=await(await fetch("/api/risk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({scores:s,correct:c.slice(0,s.length),epsilon:eps,test_score:isNaN(test)?null:test})})).json()}catch(e){out.innerHTML="error";return}
  const within=d.realized_false_action_rate<=eps+0.03;
  out.innerHTML=`<div class="metric"><div class="k">acting threshold (act iff ≥)</div><div class="big" style="margin-top:6px">${d.threshold==null?'abstain all':d.threshold.toFixed(3)}</div></div><div class="metric"><div class="k">realized false-action rate</div><div class="big" style="margin-top:6px">${(d.realized_false_action_rate*100).toFixed(1)}%</div><div style="margin-top:8px"><span class="v ${within?'ok':'bad'}">${within?'✓ within ε='+eps:'above budget'}</span> · acted ${d.acted}/${d.n}</div></div>${d.decision?`<div class="metric"><div class="k">decision for score ${d.test_score}</div><div style="margin-top:8px"><span class="v ${d.decision==='act'?'ok':'bad'}">${d.decision==='act'?'▶ ACT':'⏸ ABSTAIN → escalate'}</span></div></div>`:''}`}

/* boot */
preset();renderNav();go("build");
window.addEventListener("resize",()=>{if(current==="build")bCanvas()});
</script>
