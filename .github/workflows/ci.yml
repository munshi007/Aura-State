name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Zero-setup demo smoke (embedded agent, fail-closed exit code)
        run: |
          # The bundled agent is vulnerable → demo must exit non-zero (proves the
          # gate exit code + that the embedded demo ships and runs).
          if python -m aura_state.cli demo --no-color; then
            echo "ERROR: demo exited 0 but the bundled agent is vulnerable"; exit 1
          else
            echo "demo exited non-zero as expected"
          fi
